[package]
name = "pnsrouter"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Interactive push and shove PCB router, inspired by KiCad's PNS router"
repository = "https://github.com/Tubbles/pnsrouter"
readme = "README.md"
keywords = ["pcb", "eda", "routing", "router"]
categories = ["science", "algorithms"]

[features]
# Turn compiler warnings into errors (used on CI).
fail-on-warnings = []

[dependencies]
# R*-tree for the per layer spatial sub indices, see DESIGN.md section 10 and
# doc/reference/kicad/01-geometry.md section 14.5.
rstar = "0.13"

[dev-dependencies]
# Property based tests for the geometry layer, see
# tests/geometry_props.rs.
proptest = "1"
