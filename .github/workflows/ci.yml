name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Clippy runs on the MSRV, which is the toolchain of the development
      # container and of LibrePCB's CI image, so a lint that passes locally
      # passes here. Newer lints are picked up when the MSRV moves.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.92.0"
          components: clippy
      - run: cargo clippy --all-targets --features fail-on-warnings -- -D warnings

  test:
    name: Test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, "1.92.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo build --features fail-on-warnings
      - run: cargo test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --document-private-items

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cargo.toml keeps KiCad's 12 MB regression corpus, the reference
      # notes and the two tests that read the corpus out of the published
      # crate. A test that starts reading an excluded file compiles and
      # passes here but breaks for whoever downloads the crate, so the
      # packaged set is built and run on its own.
      - run: cargo package
      - name: Test the packaged crate
        run: cargo test --manifest-path "$(echo target/package/*/Cargo.toml)"
